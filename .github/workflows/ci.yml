# CI — roda em todo push na main e em todo pull request.
# Front (apps/web), API (apps/api) e banco (Supabase local e descartável, só dentro do CI).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Front (apps/web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Formatação
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build

  api:
    name: API (apps/api)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Instalar dependências
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Formatação
        run: uv run ruff format --check .

      # Testes que precisam de banco (marca "banco") são pulados aqui e rodam no job "banco".
      - name: Testes
        run: uv run pytest

  # Supabase LOCAL dentro do runner do GitHub (Docker), apagado no fim. Não é o projeto pago (P-022):
  # valida migrations do zero, testes pgTAP e a API contra um banco de verdade (P-023, P-034).
  banco:
    name: Banco (supabase + integração da API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # O provider Azure está ligado no config.toml; no CI não há Entra, só valores falsos.
      AZURE_CLIENT_ID: ci
      AZURE_CLIENT_SECRET: ci
      AZURE_TENANT_URL: https://login.microsoftonline.com/ci
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Subir Supabase (migrations + seed + seed.dev)
        id: supabase
        run: supabase start -x studio,edge-runtime,logflare,vector,imgproxy

      # As falhas viram anotação (::error), legível no resumo do run mesmo sem abrir o log.
      - name: Testes do banco (pgTAP)
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee pgtap.log || {
            echo "::error title=pgTAP::$(grep -E 'not ok|^#|ERROR|Failed|psql' pgtap.log | head -40 | sed ':a;N;$!ba;s/
/%0A/g')"
            exit 1
          }

      - name: Variáveis do banco local para a API
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' }}
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_JWT_SECRET=$JWT_SECRET"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "DATABASE_URL=postgresql://central_api:central_api_local@127.0.0.1:54322/postgres"
            echo "AMBIENTE=dev"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$SERVICE_ROLE_KEY"

      - uses: astral-sh/setup-uv@v6
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' }}
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Testes de integração da API
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' }}
        working-directory: apps/api
        run: |
          set -o pipefail
          uv sync --frozen
          uv run pytest -m banco -v -rs --tb=short 2>&1 | tee pytest.log || {
            echo "::error title=Integração da API::$(grep -E 'FAILED|ERROR|Error|assert|codigo|detalhe' pytest.log | head -40 | sed ':a;N;$!ba;s/
/%0A/g')"
            exit 1
          }

      - name: Logs do Supabase (se falhar)
        if: failure()
        run: docker ps -a && supabase status || true
